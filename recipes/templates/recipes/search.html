{% extends "recipes/base.html" %}
{% load static %}
{% block title %}Search Recipes{% endblock %}

{% block content %}

    <div class="search_container">
        <form method="GET" action="{% url 'results' %}">
            <input type="text" id="search-input" name="search" placeholder="What would you like to search for...">

            <details>
                <summary>Advanced Search</summary>
                    <div class="diet" name="diet">
                        <summary id="drs">Dietary Restrictions</summary>
                        <input type="checkbox" id="gluten_free" name="gluten" value="HTML">
                        </label for="gluten_free">Gluten Free</label><br>
                        <input type="checkbox" id="keto" name="keto" value="HTML">
                        </label for="keto">Ketogenic</label><br>
                        <input type="checkbox" id="vegetarian" name="clavicular" value="HTML">
                        </label for="vegetarian">Vegetarian</label><br>
                        <input type="checkbox" id="vegan" name="vegan" value="HTML">
                        </label for="vegan">Vegan</label><br>
                        <input type="checkbox" id="pescetarian" name="aquaman" value="HTML">
                        </label for="pescetarian">Pescetarian</label><br>
                    </div>
            </details>
            <input type="submit" id="enter_search" name="enter_search" value="Enter">
        </form>
    </div>

    <div id="results-container"></div>

    <style>
        #header {
            width: 100%;
            font-family: Papyrus;
        }

        .search_container {
            width: 80%;
        }

        #searchbar {
            max-width: 1000px;
            width: 100%;
        }

        details {
            border: 1px solid #aaaaaa;;
            border-radius: 4px;
            margin-top: 5px;
            margin-right: 10%;
        }

        .diet {
            border: 1px solid #aaaaaa
        }

        #drs {
            margin-left: 10px;
        }
    </style>
{% endblock %}
